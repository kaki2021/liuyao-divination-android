name: Build Android APK
on:
  push:
    branches: [build/apk-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build web resources
        working-directory: android
        run: |
          npm ci
          npm run build:web
      - name: Check and prepare payload
        run: |
          python software_prep/run_checks.py
          python android/prepare.py
      - name: Build independently installable APK
        working-directory: android
        run: bash gradlew -PseparateInstall=true assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: guanxiang-study-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
