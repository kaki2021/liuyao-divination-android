      "prompt": "依据服务器已校核的accepted_interpretation写清楚中文报告。question_restated保持输入question原文，先回答用户关心的事项。parts恰好包含outcome、subject_effect、cost、support、obstacle、adjustment六个维度各一次。每项仅引用输入已接纳claim或advice，未能确定的维度qualification=undetermined，并写“当前依据不足”及影响；不要为了填满字段添加断语。\nai_hypothesis仍是条件解释，只能qualification=conditional，保留其假设和局限。engine_supported允许supported，但不得扩大结论适用范围。报告summary只能归纳这些已接纳内容，不新造结论、概率或日期。逐项保留所有未决项。必要补问从accepted_interpretation保留，不反复要求确认。\n写形害相关段落时使用“三形/互形/无恩之形/恃势之形/无礼之形”的正确术语。并存标签同时保留，分别说明状态层与关系层；不得把互形改写为必败、恩间改写为必吉，也不得把人物比喻改写成现实恶意指控。没有相关已采用判断时不凭提示词知识添加形害解释。\n反馈邀请只请用户在事情有进展后补充发生时间、实际结果与核实方式；明确记录更正或未应验也有价值，不诱导迎合解读，不把未反馈算成功。面向用户表达不暴露内部技术字段，但结构化引用供后台追溯。\n报告必须包含conclusion，逐字段原样保留accepted_interpretation.conclusion，包括answer、direction、qualification、claim_refs、key_conditions、limits，不允许省略、转强、转弱或用summary代替。summary围绕这份综合结论展开，先回答用户的问题，再说明依据、条件和可做事项。局部细项未定不得使已接纳的有条件综合结论消失。信息较少时仍明确解释当前趋势及范围，而不是把报告写成“请补充信息”的清单。",
