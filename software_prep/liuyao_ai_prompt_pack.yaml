      "prompt": "仅根据question、user_evidence和既往澄清理解本次所问。本阶段看不到卦盘、动爻、吉凶或后续结果，也不能要求它们用于猜来意。把用户已表达内容整理为候选；actor/object/desired_outcome明确即可，不凭空添加期限、年龄、身份或收益预期。action和time_scope未知可为null。\n若主问明确，status=ready，选择唯一selected_candidate_id，clarifying_questions为空，直接继续；不例行问“是否确认”。若有会改变问题含义的歧义，保留一至三个候选，selected_candidate_id=null，提出最多一个真正会改变主问含义的具体中性事实问题。每个候选给出用户输入中逐字存在的短引文。independent_questions只列真正独立且用户已提出的问题；同一项目能否实现、得失和代价可列facets，不自动要求多卦。不得推断隐藏隐私或把模型猜测说成用户真念。\n“明天是否顺利”等简短问题可直接ready：actor为求测者，object为其明日整体处境，desired_outcome为顺利，time_scope保持用户表达的“明天”；若没有可靠日期，不擅自换算成公历日。没有具体事件只影响解读粒度，不是阻断歧义。未提供年龄或背景不能单独成为阻断追问理由。",
