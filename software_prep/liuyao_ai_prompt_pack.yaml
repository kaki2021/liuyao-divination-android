      ],
      "prompt": "读取本案facts、rules、inferences、selection及unresolved_gaps。主动分析主目标实现条件、主体得失、支持阻碍、代价及可调整环节。给出claims，不把这些维度压成一个吉凶字。\nkind=engine_supported时必须引用本次status=verified的inference；proposition、direction必须与其conclusion、direction逐项相同，fact_refs必须包含其全部premise_fact_ids，rule_refs必须包含其rule_id，适用scope不能被文字扩大。只有一个真实rule_id不能证明你的断语。\n对规则与现实关系的进一步解释使用ai_hypothesis：引用相关获准核心或核心补充规则及事实，写明assumptions和limitations，requires_review=true，不伪装成运算已确认。可同时给出竞争解释；若规则不支持则仅列uncertainties。real_world_context只复述用户已知背景事实，不产生卦象预测，rule_refs及inference_refs为空。建议注明system_interpretation或real_world_information，列证据与成立条件；不要借建议字段塞入无依据预测。\n必须逐项披露unresolved_gaps，包括GAP_SELECTION_前缀的取用未决项、待补充问题与采用条件。selection为ready仅表示当前主候选可以进入解释，不代表这些条件已经核实；说明每项条件会影响本次哪些结论、细节或适用范围，并将实际使用的条件写入相应claims的assumptions或limitations。不要忽略取用阶段的疑问，也不要因为仅缺日期、年龄或细节而清空已有依据支持的粗略解读。影响某维度的blocking gap存在时，该维度不可输出确定的engine_supported成败结论；其他可算内容仍可输出。status=needs_review用于仍有AI假设待校核；partial用于受缺口限制；supported只用于无缺口且无待复核解释。新增不明点用澄清问题或AI_GAP_前缀gap_id表达，不能默默补齐。\n形、害的关系事实按服务端fact分别接收：同一对地支可保留多种关系。分类事实只证明所归类别，不自动证明现实吉凶；解释形的具体表现时引用本案已有的大象判断及作用对象，缺大象时保留待定。恩间的利人/利己动机叙述不得自动推出效果好；害间的比喻不得证明现实人物的恶意。形害标签可作AI条件解释的依据，但不能替代完整成败条件。\n缺日期不等于不能分析已有盘面，也不允许用录入时间替代实际日期。即使存在日月强弱、精确应期或变爻六亲的缺口，仍应运用本次已提供事实及适用规则形成范围有限的趋势、主体得失与行动建议；不得以这些局部缺口清空已有依据。只有现有资料确实没有任何适用的结果或主体作用依据时，才保留具体无法判定的事项。\n必须提供conclusion={answer,direction,qualification,claim_refs,key_conditions,limits}，先用answer直接回答主问；summary或罗列六亲不能替代结论。direction为favorable/unfavorable/mixed/undetermined；qualification仅conditional或undetermined。可用“整体偏顺，但……”“阻力较明显，先……”“有可推进部分，也有……”，不能以一个局部相生关系断言全局必成。conditional必须引用至少一条outcome或subject_effect维度的engine_supported/ai_hypothesis，方向须与主要依据一致；只有support、取用归属、形害类别或背景事实，不能推出总成败。若主要依据有利与不利并存且无法确定净作用，direction=mixed。把引用claims的assumptions逐字完整保留到key_conditions、limitations逐字完整保留到limits；limits至少一项，说明本次判断的实际范围。不存在足够总判断依据时qualification=undetermined且direction=undetermined，answer仍回答当前能说明什么、卡在哪个具体作用条件，不接受只写“引擎未完成，无法解卦”。条件假设不是确定预言，必须保留requires_review=true。",
