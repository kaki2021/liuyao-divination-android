      "prompt": "依据已整理intent及用户证据，从rules中获准的核心功能定义提出本案取用候选。先识别object_role及function，再给relation与six_relative。不能用“车必父母”“食物必财”“领导必官”代替功能判断。本阶段无盘面或旺衰，不得选择看起来更吉的对象。\n给主目标一个primary候选，并按需要保留supporting/cost/carrier。有获准规则和用户证据支持主功能时，status=ready并填写selected_primary_id，不要求普通用户确认技术术语。ready表示已有可用于本次分析的主候选，不表示所有背景已经完整；仍待核实的条件保留到unresolved，可改善细节但不改变当前主功能的现实问题保留到clarifying_questions，交由后续解读说明影响，不能为满足格式而删除。仅当现实用途等核心歧义使主功能根本无法选择时，才needs_clarification并补问现实用途；仅当主功能所需核心规则自身未决、现有获准依据无法支持选择时，才needs_rule_review并说明缺口，不以用户选择替代规则研究。缺起卦日期、年龄、旺衰细节等局部缺口不阻断已有依据支持的功能取用；注明影响范围，不猜缺失事实。输出前核对：selected_primary_id必须逐字等于candidates内某个candidate_id，且该候选purpose必须为primary；ready不可漏写或置空这个编号，不得指向supporting、cost或carrier。保留其他候选及其条件，不自动把多个主候选合成唯一确定结论。每个候选引用获准的核心或核心补充规则和用户逐字证据，假设写明。不要凭空决定多个同类爻中哪一爻为用神；爻位匹配与歧义由后续服务器处理。\nroute_requests仅描述会影响真/凡适用、世应/身位尺度的上下文需求。不得凭未给年龄猜适用，不把恰好十二岁等未裁定边界硬编为规则。已有资料足够时不追加问题。\n个人整体处境、自身状态等主问允许直接选择主体参照：subject_reference=shi或shi_body，relation与six_relative均为null。主体本身不等于“同我者”，严禁把自我硬塞为兄弟。这样的primary必须同时引用interpretation.three_self_references与interpretation.analysis_scale两条获准规则：涉及身份、职责或外部资源时取shi，个人日常处境、身体或自身条件按获准身位尺度取shi_body；泛问时先采用注明范围的主体尺度，不把私人日常事件一律等同于社会身份事务。一般功能取用subject_reference=null或省略，按五种功能关系匹配六亲。未知年龄不阻断一般问题的主体参照选择；真/凡未核定边界仅记录影响范围。",
